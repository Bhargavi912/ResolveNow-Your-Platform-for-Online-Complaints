<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - ResolveNow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }
    
    .container {
      background: white;
      border-radius: 16px;
      padding: 3rem 2rem;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 400px;
      margin: 1rem;
    }
    
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: #f5f5f5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
    }
    
    h1 {
      color: #1976d2;
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    
    p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    
    .btn {
      background: #1976d2;
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }
    
    .btn:hover {
      background: #1565c0;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(25, 118, 210, 0.4);
    }
    
    .status {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      background: #fff3cd;
      border-radius: 20px;
      color: #856404;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Some features may not be available until you're back online.</p>
    <button class="btn" onclick="window.location.reload()">
      Try Again
    </button>
    <div class="status" id="status">Checking connection...</div>
  </div>

  <script>
    function checkConnection() {
      const status = document.getElementById('status');
      if (navigator.onLine) {
        status.textContent = '✓ Back online! Tap to refresh';
        status.style.background = '#d4edda';
        status.style.color = '#155724';
      } else {
        status.textContent = '✗ Still offline';
        status.style.background = '#fff3cd';
        status.style.color = '#856404';
      }
    }

    // Check connection status periodically
    setInterval(checkConnection, 3000);
    checkConnection();

    // Listen for online/offline events
    window.addEventListener('online', () => {
      document.getElementById('status').textContent = '✓ Connection restored!';
      setTimeout(() => window.location.reload(), 1500);
    });

    window.addEventListener('offline', checkConnection);
  </script>
</body>
</html>
