<!-- ResolveNow App Icon - 192x192 -->
<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="192" height="192" fill="#1976d2" rx="32"/>
  
  <!-- Check mark icon (complaint resolved) -->
  <g transform="translate(96, 96)">
    <!-- Circle background -->
    <circle cx="0" cy="0" r="60" fill="#ffffff" opacity="0.2"/>
    
    <!-- Check mark -->
    <path d="M -25 -5 L -10 15 L 30 -25" 
          stroke="#ffffff" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
  </g>
  
  <!-- Text -->
  <text x="96" y="155" 
        font-family="Arial, sans-serif" 
        font-size="24" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle">
    ResolveNow
  </text>
</svg>
